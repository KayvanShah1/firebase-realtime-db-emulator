[project]
name = "firebase-realtime-db-emulator"
version = "0.1.0"
description = "A Firebase Realtime Database emulator backed by MongoDB"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.78.0",
    "fastapi-mail>=1.0.9",
    "gunicorn>=20.1.0",
    "jinja2",
    "motor==3.1.1",
    "passlib[bcrypt]",
    "pydantic-settings>=2.14.2",
    "pydantic[email]>=2.12.0",
    "pymongo[srv]==4.3.3",
    "python-jose[cryptography]",
    "python-multipart>=0.0.5",
    "pyyaml>=6.0",
    "uvicorn[standard]",
]


[dependency-groups]
dev = [
    "httpx2",
    "mongomock-motor",
    "pytest>=9.0.0",
    "rich",
    "ruff>=0.14.9",
]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "unit: fast tests without HTTP or database integration",
    "integration: in-process API tests with an isolated database",
    "real_db: opt-in tests against the configured MongoDB server",
]
filterwarnings = [
    "ignore:datetime.datetime.utcfromtimestamp.*:DeprecationWarning:bson.datetime_ms",
]

[tool.ruff]
extend-include = ["*.ipynb"]
line-length = 120
target-version = "py312"

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 120
quote-style = "double"

[tool.ruff.lint.pycodestyle]
# But override the linter's enforced line length to 10.
max-line-length = 120
