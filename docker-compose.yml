name: firemongo

services:
  firemongo:
    image: "${IMAGE_NAME:-ghcr.io/kayvanshah1/firebase-realtime-db-emulator}:${IMAGE_TAG:-latest}"
    build:
      context: .
      target: runtime
    init: true
    ports:
      - "${HOST_PORT:-8080}:${PORT:-8080}"
    env_file:
      - .env
    environment:
      PORT: "${PORT:-8080}"
    restart: unless-stopped
